<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер отзывов</title>
    <style>
        /* Стили для наглядности */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .reviews {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .slider-container {
            position: relative;
            min-height: 200px; /* Чтобы кнопки не прыгали */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .review-card {
            display: none; /* Скрываем все карточки по умолчанию */
            padding: 20px;
            animation: fade 0.5s;
        }

        .review-card.active {
            display: block; /* Показываем только активную */
        }

        .guest-name {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .review-text {
            font-style: italic;
            color: #555;
            margin-bottom: 15px;
        }

        .stars {
            color: #ffc107;
            font-size: 1.5em;
        }

        .controls {
            margin-top: 20px;
        }

        .controls button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .controls button:hover {
            background-color: #0056b3;
        }

        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <section class="reviews">
        <h2>Отзывы гостей</h2>
        
        <div class="slider-container">
            <!-- Карточка 1 -->
            <div class="review-card active">
                <div class="guest-name">Артём Попиков</div>
                <div class="review-text">Отличный сервис! Всё понравилось, обязательно вернусь ещё.</div>
                <div class="stars">★★★★★</div>
            </div>

            <!-- Карточка 2 -->
            <div class="review-card">
                <div class="guest-name">Иван Иванов</div>
                <div class="review-text">Хорошее место, но немного шумно. В целом, рекомендую.</div>
                <div class="stars">★★★★☆</div>
            </div>

            <!-- Карточка 3 -->
            <div class="review-card">
                <div class="guest-name">Мария Петрова</div>
                <div class="review-text">Уютная атмосфера и вежливый персонал. Спасибо за отдых!</div>
                <div class="stars">★★★★★</div>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn">← Влево</button>
            <button id="nextBtn">Вправо →</button>
        </div>
    </section>

    <script src="js/slider.js"></script>
</body>
</html>
