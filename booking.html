<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Grand Horizon Hotel</title>
    
    <!-- Подключение стилей в правильном порядке -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/forms.css">
</head>
<body>

    <!-- Шапка сайта (если она уже есть у команды, вставь сюда) -->
    <header class="section--soft">
        <div class="container flex-between" style="padding-block: var(--space-4);">
            <a href="index.html" style="font-weight: var(--fw-bold); font-size: var(--fs-lg);">Grand Horizon</a>
            <nav class="flex gap-4">
                <a href="index.html">Главная</a>
                <a href="rooms.html">Номера</a>
                <a href="booking.html" class="text-primary">Бронирование</a>
            </nav>
        </div>
    </header>

    <main class="container section">
        <div class="container--narrow">
            <h1 class="text-center mb-6">Забронировать номер</h1>
            <p class="text-center text-muted mb-8">Заполните форму ниже, и мы свяжемся с вами для подтверждения брони.</p>

            <form id="booking-form" novalidate>
                
                <!-- Поле ФИО -->
                <div class="form-group">
                    <label for="fullname">ФИО гостя <span class="text-error">*</span></label>
                    <input type="text" id="fullname" name="fullname" placeholder="Иванов Иван Иванович">
                    <span class="error-message"></span>
                </div>

                <!-- Поле Телефон -->
                <div class="form-group">
                    <label for="phone">Телефон <span class="text-error">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="+7(___)___-__-__">
                    <span class="error-message"></span>
                </div>

                <!-- Поле Email -->
                <div class="form-group">
                    <label for="email">Email <span class="text-error">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru">
                    <span class="error-message"></span>
                </div>

                <!-- Выбор номера -->
                <div class="form-group">
                    <label for="room-type">Выбор номера <span class="text-error">*</span></label>
                    <select id="room-type" name="room-type">
                        <option value="">-- Выберите категорию --</option>
                        <option value="standard">Стандарт (3 000 ₽/ночь)</option>
                        <option value="comfort">Комфорт (3 900 ₽/ночь)</option>
                        <option value="lux">Люкс (5 100 ₽/ночь)</option>
                    </select>
                    <span class="error-message"></span>
                </div>

                <!-- Даты заезда и выезда -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="check-in">Дата заезда <span class="text-error">*</span></label>
                        <input type="date" id="check-in" name="check-in">
                        <span class="error-message"></span>
                    </div>
                    <div class="form-group">
                        <label for="check-out">Дата выезда <span class="text-error">*</span></label>
                        <input type="date" id="check-out" name="check-out">
                        <span class="error-message"></span>
                    </div>
                </div>

                <!-- Особые пожелания -->
                <div class="form-group">
                    <label for="wishes">Особые пожелания</label>
                    <textarea id="wishes" name="wishes" rows="4" placeholder="Аллергия на перо, нужна детская кроватка..."></textarea>
                </div>

                <!-- Чекбокс согласия -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="agreement" name="agreement">
                    <label for="agreement">Согласен на обработку персональных данных <span class="text-error">*</span></label>
                    <span class="error-message"></span>
                </div>

                <button type="submit" class="btn-submit">Забронировать</button>
            </form>
        </div>
    </main>

    <!-- Подвал сайта (если он есть у команды, вставь сюда) -->
    <footer class="section--dark" style="padding-block: var(--space-5); text-align: center;">
        <p class="text-sm">© 2026 Grand Horizon Hotel. Все права защищены.</p>
    </footer>

    <!-- Подключение скрипта валидации -->
    <script src="js/validation.js"></script>
</body>
</html>
