<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Номера и цены — калькулятор стоимости | Отель «Grand Aurora»</title>
  <meta name="description" content="Укажите даты, количество гостей и тип номера — калькулятор покажет итоговую стоимость проживания.">

  <!-- Порядок подключения важен: reset -> variables -> main -> rooms -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/rooms.css">
</head>
<body>

  <!-- ══════════ Шапка сайта подключается здесь ══════════ -->

  <main>
    <!-- ══════════ БЛОК КАЛЬКУЛЯТОРА ══════════ -->
    <section class="section section--soft" id="calc" aria-labelledby="calc-title">
      <div class="container">

        <div class="section-header">
          <h2 class="section-header__title" id="calc-title">Калькулятор стоимости проживания</h2>
          <p class="section-header__subtitle">
            Укажите даты заезда и выезда, количество гостей и тип номера —
            итоговая цена появится в блоке ниже.
          </p>
        </div>

        <form class="calc" id="booking-calc" action="#" method="get">

          <!-- Даты и гости -->
          <div class="calc__grid">
            <div class="calc__field">
              <label class="calc__label" for="check-in">Дата заезда</label>
              <input class="calc__input" type="date" id="check-in" name="check-in" required>
            </div>

            <div class="calc__field">
              <label class="calc__label" for="check-out">Дата выезда</label>
              <input class="calc__input" type="date" id="check-out" name="check-out" required>
            </div>

            <div class="calc__field">
              <label class="calc__label" for="guests">Количество гостей</label>
              <input class="calc__input" type="number" id="guests" name="guests"
                     min="1" max="6" step="1" value="2" required>
            </div>
          </div>

          <!-- Тип номера: радиокнопки -->
          <fieldset class="calc__fieldset">
            <legend class="calc__legend">Тип номера</legend>

            <div class="calc__options">
              <label class="calc__option">
                <input type="radio" name="room-type" value="standard" data-price="3500" checked>
                <span class="calc__option-card">
                  <span class="calc__option-name">Стандарт</span>
                  <span class="calc__option-price">от 3 500 ₽ / ночь</span>
                </span>
              </label>

              <label class="calc__option">
                <input type="radio" name="room-type" value="comfort" data-price="5200">
                <span class="calc__option-card">
                  <span class="calc__option-name">Комфорт</span>
                  <span class="calc__option-price">от 5 200 ₽ / ночь</span>
                </span>
              </label>

              <label class="calc__option">
                <input type="radio" name="room-type" value="lux" data-price="8900">
                <span class="calc__option-card">
                  <span class="calc__option-name">Люкс</span>
                  <span class="calc__option-price">от 8 900 ₽ / ночь</span>
                </span>
              </label>
            </div>
          </fieldset>

          <!-- Блок вывода итоговой цены (заполняется JS) -->
          <output class="calc__total" id="calc-total"
                  for="check-in check-out guests" aria-live="polite">
            <span class="calc__total-label">Итоговая цена:</span>
            <span class="calc__total-value" id="calc-total-value">—</span>
            <span class="calc__total-hint text-xs" id="calc-total-hint">
              Выберите даты пребывания — и здесь появится расчёт.
            </span>
          </output>

          <button class="calc__submit" type="submit">Рассчитать стоимость</button>
        </form>

      </div>
    </section>
    <!-- ══════════ /БЛОК КАЛЬКУЛЯТОРА ══════════ -->
  </main>

  <!-- ══════════ Подвал сайта подключается здесь ══════════ -->

</body>
</html>
