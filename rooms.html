<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Grand Horizon Hotel</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/forms.css">
</head>
<body>
    <form id="calculator">
        <h3> Калькулятор стоимости </h3>
        <label for arrive> Дата заезда </label>
        <input type="date" id="arrive">
        <label for leave> Дата выезда </label>
        <input type="date" id="leave">
        <label for="guestnumber"> Количество гостей </label>
        <input type="number" id="guestnumber" min="1" max="5">
        <input type="radio" name="roomtype" id="standard" value="standard">
        <input type="radio" name="roomtype" id="comfort" value="comfort">
        <input type="radio" name="roomtype" id="lux" value="lux">
        <button id="calcbutton"> Рассчитать </button>
        <div id="resultblock" hidden>
            <label> Итоговая цена </label>
            <h3 id="output"></h3>
        </div>
    </form>
</body>
